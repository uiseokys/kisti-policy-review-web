name: Test synthetic review app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run check:secrets
      - run: pnpm run test:export
      - run: pnpm run test:supabase
        # Without an explicitly configured disposable Supabase project this reports NOT RUN.
